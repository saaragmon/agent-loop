[project]
name = "agent-loop"
version = "0.1.0"
description = "Orchestrator builds a site with parallel agent workers, then a QA agent plays each page in a real browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a,mcp]>=2.2.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "openai>=2.0.0",
    "mcp>=1.0.0",
    "strands-agents[openai]>=1.43.0",
    "pydantic-ai-slim[mcp,openai]>=1.107.0",
    "fastmcp>=2.0.0",
    "agent-framework-core>=1.8.1",
    "agent-framework-openai>=1.8.1",
    "agno[mcp]>=2.6.14",
]

[tool.uv]
package = false
